name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node --import tsx scripts/releaseDemo.ts
      - run: pnpm test
      - run: pnpm build
      - run: npm install --prefix build/browser-tools --no-audit --no-fund playwright@1.55.1
      - run: node build/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - run: node --import tsx tests/registration-browser.mts
        env:
          IVCS_PLAYWRIGHT_MODULE: ../build/browser-tools/node_modules/playwright
          IVCS_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: build/*.png
